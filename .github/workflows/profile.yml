name: profile

# Titles the run in the list. It is evaluated before the job starts, so it cannot
# use the label the run derives, only what was typed.
run-name: ${{ inputs.label || format('profile {0}:{1}{2}', inputs.feature_fork, inputs.feature, inputs.mode == 'compare' && format(' vs {0}', inputs.base) || '') }}

# CPU profiles of the block replay, one per measured pass, instead of a report.
# Same box and harness as bench, and dispatch only for the same reason: starting
# one is running whatever ref it is given, as a user with passwordless root.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compare two refs, or profile the feature on its own"
        type: choice
        options: ["compare", "single"]
        default: compare
      feature_fork:
        description: "feature fork"
        type: choice
        options: ["ethereum", "cskiraly", "fjl", "healthykim", "jrhea",
                  "lightclient", "MariusVanDerWijden", "rjl493456442"]
        default: ethereum
      feature:
        description: "feature branch, tag, or commit to profile"
        required: true
      base_fork:
        description: "base fork. Ignored for single"
        type: choice
        options: ["ethereum", "cskiraly", "fjl", "healthykim", "jrhea",
                  "lightclient", "MariusVanDerWijden", "rjl493456442"]
        default: ethereum
      base:
        description: "base branch, tag, or commit, or 'fork-point'. Ignored for single"
        required: true
        default: fork-point
      label:
        description: "label (optional)"
        required: false
        default: ""
      blocks:
        description: "blocks per pass"
        type: choice
        options: ["2000", "20", "500", "1000"]
        default: "2000"
      go:
        description: "Go version for both sides, empty to use each ref's own"
        required: false
        default: ""
      geth_args:
        description: "extra geth flags, applied to both sides"
        required: false
        default: ""

jobs:
  # Shares the runner with bench, which takes one job at a time, so a profile
  # queues behind a benchmark and the other way round. bench.sh's flock and
  # start-bench.sh's check for a running unit cover anything else. Results go to
  # benchmarks/profile/, never a benchmark's own directory.
  profile:
    runs-on: [self-hosted, bench-box]
    timeout-minutes: 120
    steps:
      # The deployed clone is the one the systemd units point at, so update it
      # rather than using a second checkout in the runner's workspace.
      - name: update the box's clone
        env:
          REF: ${{ github.ref_name }}
        run: |
          cd /home/debian/geth-benchmark
          git fetch -q origin
          git reset -q --hard "origin/$REF"
          git submodule update --init -q
          echo "at $(git rev-parse --short HEAD)"

      - name: resolve the refs and the label
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base }}
          BASE_FORK: ${{ inputs.base_fork }}
          FEATURE: ${{ inputs.feature }}
          FEATURE_FORK: ${{ inputs.feature_fork }}
          LABEL: ${{ inputs.label }}
        run: bash /home/debian/geth-benchmark/scripts/resolve.sh

      # One run is a warmup and then one pass per side. The warmup stays, since
      # without it whichever side went first would be profiled against a cold
      # cache, and the difference would show up as a code change.
      - name: profile it
        env:
          BASE: ${{ steps.resolve.outputs.base }}
          BASE_LABEL: ${{ steps.resolve.outputs.base_label }}
          FEATURE: ${{ steps.resolve.outputs.feature }}
          LABEL: ${{ steps.resolve.outputs.label }}
          BLOCKS: ${{ inputs.blocks }}
          RUNS: 1
          GETH_ARGS: ${{ inputs.geth_args }}
          GO: ${{ inputs.go }}
          PROFILE: 1
          WAIT: 1
        run: bash /home/debian/geth-benchmark/scripts/start-bench.sh

      # Cancelling the job kills the step, not the unit it started. Without this
      # the run carries on and the next dispatch collides with it.
      - name: stop the run if the job was cancelled
        if: cancelled()
        run: |
          sudo systemctl stop --no-block bench || true
          echo "asked systemd to stop bench"

      - name: summary
        if: always()
        env:
          LABEL: ${{ steps.resolve.outputs.label }}
        run: |
          # -e is on, and an empty glob fails the pipeline, which would skip the
          # journal fallback on exactly the runs that need it.
          D=$(ls -1dt /home/debian/benchmarks/profile/"$LABEL"/results/*/ 2>/dev/null | head -1 || true)
          D=${D%/}
          if [ -n "$D" ]; then echo "RESULTS=$D" >> "$GITHUB_ENV"; fi
          if [ -n "$D" ] && [ -s "$D/profile.md" ]; then
            cat "$D/profile.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no profile summary was written, see the journal:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sudo journalctl -u bench -n 40 -o cat >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload the profiles
        if: always() && env.RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: profile-${{ steps.resolve.outputs.label }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS }}/profile.md
            ${{ env.RESULTS }}/bench-meta.json
            ${{ env.RESULTS }}/*.pprof
            ${{ env.RESULTS }}/run*/*/cpu.pprof
            ${{ env.RESULTS }}/slowblock.log
          if-no-files-found: warn
