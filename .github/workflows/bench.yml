name: bench

# Titles the run in the list. It is evaluated before the job starts, so it cannot
# use the label the run derives, only what was typed.
run-name: ${{ inputs.label || format('{0}:{1} vs {2}', inputs.feature_fork, inputs.feature, inputs.base) }}

# Dispatch only. No pull_request or issue_comment trigger: a benchmark builds and
# runs whatever ref it is given, on a box where debian has passwordless root, so
# the ability to start one is the ability to run code there. Dispatch requires
# write access to this repo, which is the gate.
on:
  workflow_dispatch:
    inputs:
      feature_fork:
        description: "feature fork"
        type: choice
        options: ["ethereum", "cskiraly", "fjl", "healthykim", "jrhea",
                  "lightclient", "MariusVanDerWijden", "rjl493456442"]
        default: ethereum
      feature:
        description: "feature branch, tag, or commit to measure"
        required: true
      base_fork:
        description: "base fork"
        type: choice
        options: ["ethereum", "cskiraly", "fjl", "healthykim", "jrhea",
                  "lightclient", "MariusVanDerWijden", "rjl493456442"]
        default: ethereum
      base:
        description: "base branch, tag, or commit to measure"
        required: true
        default: fork-point
      label:
        description: "label (optional)"
        required: false
        default: ""
      blocks:
        description: "blocks per pass."
        type: choice
        options: ["2000", "20", "500", "1000"]
        default: "2000"
      runs:
        description: "runs per side"
        type: choice
        options: ["3", "1", "2", "5"]
        default: "3"
      geth_args:
        description: "extra geth flags, applied to both sides"
        required: false
        default: ""

jobs:
  # There is one datadir and one port pair, so runs have to be serialized. The
  # runner does that by taking one job at a time, and WAIT below keeps the job
  # occupied for the whole run, so dispatches queue behind each other. bench.sh
  # also holds an flock, which covers a launch from a laptop that the runner
  # knows nothing about.
  #
  # Deliberately no concurrency group. A group keeps only one run waiting and
  # cancels the earlier one when another arrives, which loses queued requests.
  bench:
    runs-on: [self-hosted, bench-box]
    timeout-minutes: 180
    steps:
      # The deployed clone is the one the systemd units point at, so update it
      # rather than using a second checkout in the runner's workspace.
      - name: update the box's clone
        env:
          REF: ${{ github.ref_name }}
        run: |
          cd /home/debian/geth-benchmark
          git fetch -q origin
          git reset -q --hard "origin/$REF"
          git submodule update --init -q
          echo "at $(git rev-parse --short HEAD)"

      - name: resolve the base and the label
        id: resolve
        env:
          BASE: ${{ inputs.base }}
          BASE_FORK: ${{ inputs.base_fork }}
          FEATURE: ${{ inputs.feature }}
          FEATURE_FORK: ${{ inputs.feature_fork }}
          LABEL: ${{ inputs.label }}
        run: |
          R=/home/debian/geth-benchmark/scripts
          # Someone else's fork becomes an owner:ref spec. jrhea is this repo's
          # own origin, and fork-point is a keyword rather than a branch, so
          # neither takes one.
          [ "$FEATURE_FORK" = jrhea ] || FEATURE="$FEATURE_FORK:$FEATURE"
          if [ "$BASE" != fork-point ] && [ "$BASE_FORK" != jrhea ]; then
            BASE="$BASE_FORK:$BASE"
          fi
          echo "feature=$FEATURE" >> "$GITHUB_OUTPUT"

          # Name it from the refs as given, before fork-point becomes a hash. A
          # given label becomes a directory name too, so it gets cleaned as well.
          if [ -n "$LABEL" ]; then
            LABEL=$(bash "$R/mklabel.sh" "$LABEL")
          else
            LABEL=$(bash "$R/mklabel.sh" "$FEATURE" "$BASE")
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "label: $LABEL"
          # the exact one, which run-name cannot know
          echo "label \`$LABEL\`" >> "$GITHUB_STEP_SUMMARY"

          cd /home/debian/go-ethereum
          git fetch -q origin --tags
          if [ "$BASE" = fork-point ]; then
            # master from the same repo as the feature, so base_fork does not
            # apply here
            FP=$(bash "$R/fork-point.sh" "$FEATURE") || exit 1
            set -- $FP
            BASE=$1
            echo "base_label=fork point" >> "$GITHUB_OUTPUT"
            echo "fork point: $BASE ($3 commits behind master)"
          else
            echo "base_label=" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # WAIT makes start-bench.sh block until the unit exits and return its
      # status, so the job reflects the run rather than just the launch.
      - name: run it
        env:
          BASE: ${{ steps.resolve.outputs.base }}
          BASE_LABEL: ${{ steps.resolve.outputs.base_label }}
          FEATURE: ${{ steps.resolve.outputs.feature }}
          LABEL: ${{ steps.resolve.outputs.label }}
          BLOCKS: ${{ inputs.blocks }}
          RUNS: ${{ inputs.runs }}
          GETH_ARGS: ${{ inputs.geth_args }}
          WAIT: 1
        run: bash /home/debian/geth-benchmark/scripts/start-bench.sh

      - name: report
        if: always()
        env:
          LABEL: ${{ steps.resolve.outputs.label }}
        run: |
          # -e is on, and an empty glob fails the pipeline, which would skip the
          # journal fallback on exactly the runs that need it.
          D=$(ls -1dt /home/debian/benchmarks/"$LABEL"/results/*/ 2>/dev/null | head -1 || true)
          D=${D%/}
          if [ -n "$D" ] && [ -f "$D/report.md" ]; then
            cat "$D/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "RESULTS=$D" >> "$GITHUB_ENV"
          else
            echo "no report was written, see the journal:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sudo journalctl -u bench -n 40 -o cat >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload the per-block data
        if: always() && env.RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ steps.resolve.outputs.label }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS }}/report.md
            ${{ env.RESULTS }}/bench-meta.json
            ${{ env.RESULTS }}/**/combined_latency.csv
          if-no-files-found: warn
